<style>/* ============================================================
   Playbox shared theme — portrait mobile game shell
   Used identically by all five games.
   ============================================================ */
:root{
  --bg:#080b14;
  --bg-2:#0e1424;
  --panel:rgba(18,26,44,.92);
  --line:rgba(255,255,255,.10);
  --txt:#e8edf7;
  --txt-dim:#8b98b4;
  --accent:#4ee1c1;
  --accent-2:#7c5cff;
  --warn:#ff6b6b;
  --gold:#ffc857;
  --ad-inset:0px;            /* raised by ads.js when a banner is on screen */
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{
  background:var(--bg);
  color:var(--txt);
  font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;
  padding-top:var(--safe-t);
  padding-bottom:calc(var(--safe-b) + var(--ad-inset));
  transition:padding-bottom .18s ease;
}
canvas{display:block;width:100%;flex:1 1 auto;min-height:0;touch-action:none}

/* ---------- overlay screens (menu / pause / game over) ---------- */
.screen{
  position:fixed;inset:0;z-index:20;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:28px 24px;
  padding-bottom:calc(28px + var(--safe-b) + var(--ad-inset));
  background:radial-gradient(120% 80% at 50% 0%,var(--bg-2) 0%,var(--bg) 70%);
  text-align:center;
}
.screen.on{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.screen h1{
  font-size:clamp(30px,10vw,48px);font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;
  background:linear-gradient(180deg,#fff,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.screen h2{font-size:clamp(20px,6vw,28px);font-weight:700;letter-spacing:.04em}
.screen p{color:var(--txt-dim);max-width:32ch;font-size:15px}

/* ---------- buttons ---------- */
.btn{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;font-size:15px;
  padding:15px 30px;border-radius:14px;min-width:210px;min-height:52px;
  color:#04121a;background:linear-gradient(180deg,var(--accent),#2fbca0);
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 26px rgba(78,225,193,.22);
  transition:transform .07s ease,box-shadow .07s ease;
}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.ghost{
  background:transparent;color:var(--txt);
  border:1px solid var(--line);box-shadow:none;
}
.btn.ghost:active{transform:translateY(2px);background:rgba(255,255,255,.05)}
.btn.reward{
  background:linear-gradient(180deg,var(--gold),#e0a52f);color:#241a02;
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 26px rgba(255,200,87,.22);
}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn .sub{display:block;font-size:11px;font-weight:600;opacity:.75;letter-spacing:.06em}

/* ---------- HUD ---------- */
.hud{
  position:relative;z-index:5;flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px;font-variant-numeric:tabular-nums;
}
.hud .stat{display:flex;flex-direction:column;line-height:1.1}
.hud .stat b{font-size:20px;font-weight:800}
.hud .stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.icon-btn{
  appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);width:40px;height:40px;border-radius:11px;font-size:17px;cursor:pointer;
  display:grid;place-items:center;
}
.icon-btn:active{background:rgba(255,255,255,.12)}

/* ---------- misc ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  font-size:12px;color:var(--txt-dim);letter-spacing:.05em;
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + var(--safe-b) + var(--ad-inset));
  z-index:40;background:var(--panel);border:1px solid var(--line);
  padding:11px 18px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
  backdrop-filter:blur(8px);max-width:88vw;text-align:center;
}
.toast.on{opacity:1}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
</style>
<style>
/* ============================================================
   Hub-only CSS. Tokens, .btn, .screen and .toast come from
   shared/style.css and are not redefined here.
   ============================================================ */

/* the shared sheet stretches every canvas to fill its flex parent;
   hub emblems are fixed-size chips, so opt them out explicitly. */
canvas.em{display:block;flex:0 0 auto;width:auto;height:auto;min-height:0}

body{overflow:hidden}
/* the shared sheet's display rules are more specific than the UA [hidden]
   rule, so make the attribute win everywhere in the hub */
[hidden]{display:none!important}

/* ---------------- header ---------------- */
.top{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:7px 10px;min-height:62px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,28,48,.75),rgba(8,11,20,0));
}
.mark{
  flex:0 1 auto;min-width:0;font-size:13px;font-weight:800;letter-spacing:.13em;
  background:linear-gradient(180deg,#fff,var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;
}
.top .spacer{flex:1 1 auto}
.pill{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;
  border:1px solid var(--line);border-radius:999px;padding:5px 8px;
  font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.04);line-height:1;
}
.pill.tok{color:var(--gold)}
.pill.stk{color:#ff9d5c}
.pill svg{width:13px;height:13px;flex:0 0 auto}
/* 48px tap targets, as the contract requires — even on a 360px phone */
.top .icon-btn{width:48px;height:48px;border-radius:13px;flex:0 0 auto}
.top .icon-btn svg{width:20px;height:20px}
.top .icon-btn[aria-current="true"]{border-color:rgba(78,225,193,.55);color:var(--accent)}
.crumb{
  display:none;flex:1 1 auto;min-width:0;font-size:16px;font-weight:700;
  letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
body[data-view="shelf"] .crumb{display:none}
body:not([data-view="shelf"]) .crumb{display:block}
body:not([data-view="shelf"]) .mark,
body:not([data-view="shelf"]) .navset{display:none}
body[data-view="shelf"] #back{display:none}
.navset{display:flex;gap:4px;flex:0 0 auto;margin-left:2px}

/* ---------------- scroller + views ---------------- */
.scroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;-webkit-overflow-scrolling:touch;
  padding:12px 12px calc(28px + var(--safe-b) + var(--ad-inset));
}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex;animation:fade .2s ease}
.eyebrow{
  font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--txt-dim);
}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;
}
.sec-title{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin:4px 2px -2px;
}
.sec-title .eyebrow{color:var(--txt-dim)}
.sec-title .hint{font-size:11px;color:var(--txt-dim)}

/* ---------------- daily challenge ---------------- */
.daily{
  background:
    radial-gradient(120% 130% at 8% 0%,rgba(124,92,255,.20) 0%,rgba(18,26,44,.94) 58%),
    var(--panel);
  border-color:rgba(124,92,255,.30);
}
.daily.done{
  background:
    radial-gradient(120% 130% at 8% 0%,rgba(255,200,87,.22) 0%,rgba(18,26,44,.94) 58%),
    var(--panel);
  border-color:rgba(255,200,87,.42);
}
.dhead{display:flex;align-items:flex-start;gap:10px}
.dhead .t{flex:1 1 auto;min-width:0}
.dtitle{font-size:17px;font-weight:800;letter-spacing:.01em;margin-top:2px}
.dcount{
  flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:.08em;
  font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:999px;padding:5px 10px;
  color:var(--txt-dim);background:rgba(255,255,255,.04);
}
.daily.done .dcount{color:var(--gold);border-color:rgba(255,200,87,.45)}
.goals{display:flex;flex-direction:column;gap:7px;margin:11px 0 10px}
.goal{
  appearance:none;font:inherit;text-align:left;cursor:pointer;width:100%;
  display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 10px;
  border:1px solid var(--line);border-radius:12px;color:var(--txt);
  background:rgba(255,255,255,.035);
  border-left:3px solid var(--c,var(--accent));
  transition:background .12s ease,transform .07s ease;
}
.goal:active{transform:translateY(1px);background:rgba(255,255,255,.09)}
.goal .gt{flex:1 1 auto;min-width:0;font-size:13.5px;line-height:1.35}
.goal .gg{
  display:block;font-size:10px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--c,var(--accent));margin-bottom:2px;
}
.goal .gp{
  flex:0 0 auto;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--txt-dim);min-width:30px;text-align:right;
}
.goal.ok{background:rgba(78,225,193,.09);border-color:rgba(78,225,193,.28)}
.goal.ok .gt{color:var(--txt-dim)}
.goal.ok .gx{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.28)}
.tick{width:22px;height:22px;flex:0 0 auto;color:var(--accent)}
.dfoot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:9px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--txt-dim);
}
.dfoot b{color:var(--gold);font-weight:800}
.dfoot .cd{font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em}
.dcheer{
  display:none;font-size:12.5px;color:var(--gold);font-weight:600;
  margin:2px 0 -2px;letter-spacing:.01em;
}
.daily.done .dcheer{display:block}

/* ---------------- game tiles ---------------- */
.tiles{display:flex;flex-direction:column;gap:9px}
.tile{
  appearance:none;font:inherit;text-align:left;cursor:pointer;width:100%;
  display:flex;align-items:center;gap:11px;min-height:76px;padding:10px;
  border:1px solid var(--line);border-radius:15px;color:var(--txt);
  background:linear-gradient(100deg,var(--tint,rgba(255,255,255,.05)),rgba(18,26,44,.92) 62%);
  transition:transform .07s ease,border-color .12s ease;
}
.tile:active{transform:translateY(2px);border-color:var(--c)}
.tile .em{width:54px;height:54px;border-radius:13px;border:1px solid rgba(255,255,255,.09)}
.tile .info{flex:1 1 auto;min-width:0}
.trow{display:flex;align-items:center;gap:7px}
.tname{font-size:16.5px;font-weight:800;letter-spacing:.01em}
.badge{
  font-size:9px;font-weight:800;letter-spacing:.12em;padding:2px 6px;border-radius:5px;
  background:var(--accent);color:#04121a;
}
.ttag{font-size:12.5px;color:var(--txt-dim);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{display:flex;align-items:baseline;gap:8px;margin-top:5px}
.tkind{
  font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--c);white-space:nowrap;
}
.tstat{
  flex:1 1 auto;min-width:0;text-align:right;font-size:11px;color:var(--txt-dim);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tstat b{color:var(--txt);font-weight:800}

/* ---------------- shop ---------------- */
.balance{
  display:flex;align-items:center;gap:12px;
  background:
    radial-gradient(120% 130% at 100% 0%,rgba(255,200,87,.18) 0%,rgba(18,26,44,.94) 60%),
    var(--panel);
  border-color:rgba(255,200,87,.32);
}
.balance .big{
  font-size:34px;font-weight:800;line-height:1;color:var(--gold);
  font-variant-numeric:tabular-nums;
}
.balance .why{font-size:11.5px;color:var(--txt-dim);line-height:1.4}
.group{margin-top:2px}
.ghead{display:flex;align-items:center;gap:8px;margin:2px 2px 7px}
.ghead .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.ghead .n{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.srow{display:flex;align-items:center;gap:10px;padding:11px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.035)}
.srow .info{flex:1 1 auto;min-width:0}
.srow .lab{font-size:14.5px;font-weight:700}
.srow .note{font-size:11.5px;color:var(--txt-dim);margin-top:2px}
.srow .own{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--accent);margin-top:3px}
.buy{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;
  flex:0 0 auto;min-width:74px;min-height:48px;border-radius:12px;padding:0 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#241a02;background:linear-gradient(180deg,var(--gold),#e0a52f);
  box-shadow:0 4px 0 rgba(0,0,0,.35);
}
.buy:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.buy b{font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
.buy svg{width:12px;height:12px}
.buy span{font-size:9px;letter-spacing:.12em;font-weight:800;opacity:.75}
.buy[disabled]{opacity:.35;pointer-events:none}

/* ---------------- stats ---------------- */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cell{
  border:1px solid var(--line);border-radius:13px;padding:11px 12px;
  background:rgba(255,255,255,.035);
}
.cell b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.cell span{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-dim)}
.cell.gold b{color:var(--gold)}
.cell.warm b{color:#ff9d5c}
.grow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.035)}
.grow .em{width:34px;height:34px;border-radius:9px}
.grow .n{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:700}
.grow .v{text-align:right;flex:0 0 auto}
.grow .v b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c)}
.grow .v span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-dim)}

/* ---------------- settings ---------------- */
.set{display:flex;flex-direction:column;gap:8px}
.srow2{
  display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 12px;
  border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);
  width:100%;font:inherit;color:var(--txt);text-align:left;appearance:none;cursor:pointer;
}
.srow2 .info{flex:1 1 auto;min-width:0}
.srow2 .lab{font-size:15px;font-weight:700}
.srow2 .note{font-size:11.5px;color:var(--txt-dim);margin-top:2px;line-height:1.35}
.sw{
  flex:0 0 auto;width:48px;height:28px;border-radius:999px;position:relative;
  background:rgba(255,255,255,.10);border:1px solid var(--line);transition:background .15s ease;
}
.sw::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--txt-dim);transition:transform .15s ease,background .15s ease;
}
.srow2[aria-checked="true"] .sw{background:rgba(78,225,193,.30);border-color:rgba(78,225,193,.5)}
.srow2[aria-checked="true"] .sw::after{transform:translateX(20px);background:var(--accent)}
.srow2 .chev{width:18px;height:18px;flex:0 0 auto;color:var(--txt-dim)}
.vers{text-align:center;font-size:11px;color:var(--txt-dim);padding:8px 0 2px;letter-spacing:.06em}

/* ---------------- what's new ---------------- */
.wn{
  background:
    radial-gradient(120% 120% at 50% 0%,rgba(78,225,193,.16) 0%,rgba(18,26,44,.94) 60%),
    var(--panel);
  border-color:rgba(78,225,193,.30);
}
.wn h2{font-size:22px;font-weight:800;letter-spacing:.02em;margin-top:3px}
.notes{display:flex;flex-direction:column;gap:9px;margin:12px 0 0}
.note-i{display:flex;gap:9px;font-size:13.5px;line-height:1.45;color:var(--txt)}
.note-i i{
  flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);
  margin-top:7px;font-style:normal;
}
.added{
  margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--txt-dim);
}
.added b{color:var(--accent)}
.view .btn{align-self:center;min-width:min(100%,260px);margin-top:2px}

/* ---------------- game frame ---------------- */
.frame{
  position:fixed;inset:0;z-index:30;display:none;flex-direction:column;
  background:var(--bg);
  padding-top:var(--safe-t);
  padding-bottom:calc(var(--safe-b) + var(--ad-inset));
}
.frame.on{display:flex}
.fbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 10px;
  min-height:46px;border-bottom:1px solid var(--line);background:rgba(8,11,20,.96);
}
.fbar .fn{flex:1 1 auto;min-width:0;font-size:14px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .fn i{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--c,var(--accent));margin-right:7px;font-style:normal}
.fexit{
  appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--txt);font:inherit;font-size:12px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;border-radius:10px;padding:0 13px;height:34px;min-width:74px;
  display:flex;align-items:center;gap:6px;justify-content:center;cursor:pointer;
}
.fexit:active{background:rgba(255,255,255,.14)}
.fexit svg{width:14px;height:14px}
#gf{flex:1 1 auto;min-height:0;width:100%;border:0;display:block;background:var(--bg)}

/* toast must clear the frame */
.toast{z-index:60;bottom:calc(96px + var(--safe-b) + var(--ad-inset))}

/* narrow phones: let the accent line and the headline stat share one row
   without either being clipped */
@media (max-width:380px){
  .tkind{font-size:9px;letter-spacing:.08em}
  .tstat{font-size:10.5px}
  .tile .em{width:50px;height:50px}
}
@media (max-height:600px){
  .dtitle{font-size:15px}
  .tile{min-height:68px}
}
</style>

    <button class="icon-btn" id="back" aria-label="Back">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6l3 4.4-3 4.4-3-4.4z" fill="currentColor" stroke="none"/></svg>

    <div class="navset">
      <button class="icon-btn" id="navStats" aria-label="Stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 20V12M10 20V5M16 20v-6M21 20H3"/></svg>

<script>/* ============================================================
   Playbox ad bridge  —  @capacitor-community/admob wrapper
   ------------------------------------------------------------
   One API for all five games. Runs as a harmless no-op in a
   desktop browser so the games stay testable outside Android.

   Three things this file exists to guarantee, because getting
   any of them wrong is what gets an ad-funded app pulled:

   1. No ad request EVER leaves the device before the consent
      flow has run. showBanner() called during boot is queued,
      not fired.
   2. Every full-screen call resolves — including when the user
      swipes the ad away. The plugin only resolves its rewarded
      call on a genuine reward, so a dismissal would otherwise
      leave a promise dangling forever and freeze the caller.
   3. The caller is not told an ad is finished until it really
      is, so nothing draws underneath a full-screen ad.

   >>> TO GO LIVE: edit shared/ad-config.js only. <<<
   ============================================================ */
(function (global) {
  'use strict';

  var CFG = global.AD_CONFIG || {};
  var cap = global.Capacitor;
  var native = !!(cap && cap.isNativePlatform && cap.isNativePlatform() &&
                  cap.Plugins && cap.Plugins.AdMob);
  var AdMob = native ? cap.Plugins.AdMob : null;

  /* ---- pacing rules (AdMob policy friendly, player friendly) ---- */
  var MIN_SECONDS_BETWEEN_INTERSTITIALS = 75;
  var ROUNDS_BETWEEN_INTERSTITIALS      = 3;   // an ad on every 3rd round end
  var GRACE_SECONDS_AFTER_LAUNCH        = 45;  // never interrupt the first taste
  var FULLSCREEN_TIMEOUT_MS             = 6 * 60 * 1000;  // last-resort unstick

  var launchedAt  = Date.now();
  var lastFullAt  = 0;
  var eventsSince = 0;
  var interReady  = false;
  var rewardReady = false;
  var bannerWant  = false;   // what the game asked for
  var bannerLive  = false;   // what is actually on screen
  var bannerH     = 58;      // replaced by the real height from the SDK
  var insetToken  = 0;       // guards against out-of-order show/hide
  var started     = false;   // init() finished: the UI must never wait on ads
  var canServe    = !native; // consent actually permits requesting ads
  var starting    = null;    // the in-flight init promise
  var consentTried = false;

  function log() {
    if (CFG.debug) console.log.apply(console, ['[ads]'].concat([].slice.call(arguments)));
  }
  function unit(kind) { return (CFG.adUnits || {})[kind] || ''; }
  function testing()  { return CFG.useTestAds !== false; }

  function setInset(px, token) {
    if (token !== undefined && token !== insetToken) return;   // a newer call won
    document.documentElement.style.setProperty('--ad-inset', px + 'px');
  }

  /* Resolves on the first of `events`, or after `ms`. Always resolves.
     Returns the payload of whichever event fired, or null on timeout. */
  function settle(events, ms) {
    return new Promise(function (resolve) {
      var offs = [], timer = null, done = false;
      function finish(payload) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        offs.forEach(function (h) { try { h.remove(); } catch (e) {} });
        resolve(payload);
      }
      events.forEach(function (name) {
        try {
          var h = AdMob.addListener(name, function (info) { finish({ name: name, info: info }); });
          // Capacitor returns either a handle or a promise of one
          if (h && typeof h.then === 'function') h.then(function (hh) { offs.push(hh); });
          else if (h) offs.push(h);
        } catch (e) { log('listener failed', name, e); }
      });
      timer = setTimeout(function () { finish(null); }, ms);
    });
  }

  // ------------------------------------------------------------
  // init — safe to call from every game screen; only runs once
  // ------------------------------------------------------------
  function init() {
    if (starting) return starting;
    starting = (async function () {
      if (!native) { started = true; log('browser mode — ads simulated'); flushBanner(); return; }
      watchBannerSize();                 // before anything can show a banner
      try {
        await AdMob.initialize({
          initializeForTesting: testing(),
          testingDevices: CFG.testDeviceIds || []
        });
      } catch (e) { log('initialize failed', e); }
      await requestConsent();            // sets canServe; never throws
      started = true;                    // the game is free to carry on either way
      openTheTap();
      log(canServe ? 'initialised' : 'initialised, ads withheld until consent');
    })();
    return starting;
  }

  /* GDPR / UMP. Required for EEA + UK traffic, and Play will reject an
     ad-funded app that ships without a consent flow. */
  async function requestConsent() {
    consentTried = true;
    try {
      var info = await AdMob.requestConsentInfo({
        debugGeography: CFG.consentDebugGeography || 0,
        testDeviceIdentifiers: CFG.testDeviceIds || []
      });
      if (info && info.isConsentFormAvailable && info.status === 'REQUIRED') {
        info = (await AdMob.showConsentForm()) || info;
      }
      /* canRequestAds is the SDK's own verdict and the only safe gate. If a
         plugin version does not report it, fall back to the status: anything
         other than an outstanding REQUIRED means we may serve. */
      if (info && typeof info.canRequestAds === 'boolean') canServe = info.canRequestAds;
      else canServe = !!(info && info.status !== 'REQUIRED');
    } catch (e) {
      /* UMP needs the network, and these games are marketed as playable
         offline. A first launch on a plane must NOT quietly become a session
         that serves ads with no consent — we simply serve nothing and try
         again next time the app comes to the foreground. */
      canServe = false;
      log('consent unavailable — no ads this session until it succeeds', e);
    }
  }

  /* Called once consent has answered. Nothing touches the SDK before this. */
  function openTheTap() {
    if (!canServe) return;
    preloadInterstitial();
    preloadRewarded();
    flushBanner();
  }

  /* Retry the consent flow when the app returns to the foreground, so an
     offline first launch heals itself rather than staying ad-free forever. */
  if (native) {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden || canServe || !consentTried) return;
      requestConsent().then(openTheTap);
    });
  }

  /* Some EU users are entitled to reopen this; wire it to a settings row. */
  async function showPrivacyOptions() {
    if (!native) return false;
    try { await AdMob.showPrivacyOptionsForm(); return true; }
    catch (e) { log('privacy form failed', e); return false; }
  }

  // ------------------------------------------------------------
  // banner
  // ------------------------------------------------------------
  /* The SDK reports the real adaptive-banner height; a hardcoded 58px
     is wrong on tablets and on some aspect ratios. */
  function watchBannerSize() {
    try {
      AdMob.addListener('bannerAdSizeChanged', function (size) {
        if (size && size.height > 0) {
          bannerH = size.height;
          if (bannerLive) setInset(bannerH, insetToken);
        }
      });
    } catch (e) { log('size listener failed', e); }
  }

  function flushBanner() { if (bannerWant) showBanner(); }

  async function showBanner() {
    bannerWant = true;
    if (!started || !canServe) { log('banner queued until consent has run'); init(); return; }
    if (bannerLive) return;
    bannerLive = true;
    var token = ++insetToken;
    if (!native) { setInset(0, token); log('banner (simulated)'); return; }
    try {
      await AdMob.showBanner({
        adId: unit('banner'),
        adSize: 'ADAPTIVE_BANNER',
        position: 'BOTTOM_CENTER',
        margin: 0,
        isTesting: testing()
      });
      setInset(bannerH, token);      // ignored if a hideBanner already superseded us
    } catch (e) { bannerLive = false; setInset(0, token); log('banner failed', e); }
  }

  async function hideBanner() {
    bannerWant = false;                 // also cancels a banner queued pre-consent
    if (!bannerLive) { setInset(0, ++insetToken); return; }
    bannerLive = false;
    var token = ++insetToken;
    setInset(0, token);
    if (!native) return;
    try { await AdMob.hideBanner(); } catch (e) { log('hideBanner failed', e); }
  }

  // ------------------------------------------------------------
  // interstitial
  // ------------------------------------------------------------
  async function preloadInterstitial() {
    if (!native) { interReady = true; return; }
    if (!started || !canServe) return;
    try {
      await AdMob.prepareInterstitial({ adId: unit('interstitial'), isTesting: testing() });
      interReady = true;
    } catch (e) { interReady = false; log('interstitial preload failed', e); }
  }

  /* Call on every natural break (round over, level complete). It decides
     for itself whether an ad is due, and — importantly — does not resolve
     until the ad is off the screen, so the caller can safely draw its next
     screen straight afterwards. Returns true if an ad was shown. */
  async function maybeInterstitial(force) {
    eventsSince++;
    var now = Date.now();
    var okGrace  = (now - launchedAt) / 1000 > GRACE_SECONDS_AFTER_LAUNCH;
    var okTime   = (now - lastFullAt) / 1000 > MIN_SECONDS_BETWEEN_INTERSTITIALS;
    var okEvents = eventsSince >= ROUNDS_BETWEEN_INTERSTITIALS;
    if (!force && !(okGrace && okTime && okEvents)) { log('interstitial skipped'); return false; }
    if (!interReady) { preloadInterstitial(); return false; }

    eventsSince = 0; interReady = false;
    if (!native) {
      lastFullAt = now;
      log('interstitial (simulated)');
      await new Promise(function (r) { setTimeout(r, 300); });
      preloadInterstitial();
      return true;
    }
    var shown = false;
    try {
      var closed = settle(['interstitialAdDismissed', 'interstitialAdFailedToShow'],
                          FULLSCREEN_TIMEOUT_MS);
      await AdMob.showInterstitial();   // resolves as soon as show() is called...
      shown = true;
      lastFullAt = Date.now();          // only a real showing spends the window
      await closed;                     // ...so wait for it to actually be gone
    } catch (e) { log('interstitial show failed', e); }
    preloadInterstitial();
    return shown;
  }

  // ------------------------------------------------------------
  // rewarded
  // ------------------------------------------------------------
  async function preloadRewarded() {
    if (!native) { rewardReady = true; return; }
    if (!started || !canServe) return;
    try {
      await AdMob.prepareRewardVideoAd({ adId: unit('rewarded'), isTesting: testing() });
      rewardReady = true;
    } catch (e) { rewardReady = false; log('rewarded preload failed', e); }
  }

  function isRewardedReady() { return rewardReady; }

  /* Resolves true only when the user genuinely earned the reward, and —
     this is the important part — ALWAYS resolves. The plugin resolves its
     own call only from the reward callback, so a user who swipes the ad
     away would otherwise leave this promise pending forever and freeze
     whatever screen is waiting on it. */
  async function showRewarded() {
    if (!rewardReady) { preloadRewarded(); return false; }
    rewardReady = false;

    if (!native) {
      log('rewarded (simulated) — granting');
      await new Promise(function (r) { setTimeout(r, 450); });
      preloadRewarded();
      return true;
    }

    var earned = false;
    try {
      var rewardSeen = null;
      try {
        rewardSeen = AdMob.addListener('onRewardedVideoAdReward', function (r) {
          if (r && r.amount > 0) earned = true;
        });
      } catch (e) { log('reward listener failed', e); }

      var finished = settle(['onRewardedVideoAdDismissed', 'onRewardedVideoAdFailedToShow'],
                            FULLSCREEN_TIMEOUT_MS);

      // Whichever comes first: the plugin's own resolve (a reward) or the
      // ad closing. Never both required.
      /* Two ways out, and only two. The plugin resolves this call ONLY when a
         reward is earned, so a resolve must still wait for the ad to close.
         A rejection, though, means nothing was ever shown — no dismissal event
         will ever arrive — so that is the one case that must short-circuit,
         otherwise the caller sits on the timeout backstop for six minutes. */
      var viaCall = AdMob.showRewardVideoAd().then(
        function (res) { if (res && res.amount > 0) earned = true; return null; },
        function (e) { log('rewarded show failed', e); return 'rejected'; });

      await Promise.race([
        finished,
        viaCall.then(function (v) { return v === 'rejected' ? v : finished; })
      ]);

      if (rewardSeen) {
        if (typeof rewardSeen.then === 'function') rewardSeen.then(function (h) { try { h.remove(); } catch (e) {} });
        else { try { rewardSeen.remove(); } catch (e) {} }
      }
    } catch (e) { log('rewarded failed', e); }

    preloadRewarded();
    return earned;
  }

  // ------------------------------------------------------------
  global.Ads = {
    init: init,
    showBanner: showBanner,
    hideBanner: hideBanner,
    maybeInterstitial: maybeInterstitial,
    showRewarded: showRewarded,
    isRewardedReady: isRewardedReady,
    showPrivacyOptions: showPrivacyOptions,
    isNative: function () { return native; }
  };
})(window);

<script>/* ============================================================
   Playbox mini-engine — canvas, loop, input, storage, audio.
   No dependencies, no assets. Shared by all five games.
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------------- persistent storage ---------------- */
  var NS = (global.GAME_ID || 'game') + ':';
  var Store = {
    get: function (k, dflt) {
      try {
        var v = localStorage.getItem(NS + k);
        return v === null ? dflt : JSON.parse(v);
      } catch (e) { return dflt; }
    },
    set: function (k, v) {
      try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {}
    },
    bump: function (k, v) {                    // keep a high score
      if (v > Store.get(k, 0)) { Store.set(k, v); return true; }
      return false;
    }
  };

  /* ---------------- synthesised audio (no files) ---------------- */
  var actx = null, muted = Store.get('muted', false);
  function ac() {
    if (!actx) {
      var C = global.AudioContext || global.webkitAudioContext;
      if (C) actx = new C();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  var Sound = {
    get muted() { return muted; },
    toggle: function () { muted = !muted; Store.set('muted', muted); return muted; },
    /* tone(freq, seconds, waveform, gain, freqSlideTo) */
    tone: function (f, dur, type, gain, to) {
      if (muted) return;
      var c = ac(); if (!c) return;
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, c.currentTime);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), c.currentTime + dur);
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.16, c.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + dur + 0.02);
    },
    noise: function (dur, gain) {
      if (muted) return;
      var c = ac(); if (!c) return;
      var n = Math.floor(c.sampleRate * dur);
      var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var s = c.createBufferSource(), g = c.createGain();
      s.buffer = buf; g.gain.value = gain || 0.1;
      s.connect(g); g.connect(c.destination); s.start();
    },
    tap:   function () { Sound.tone(660, 0.07, 'triangle', 0.10); },
    good:  function () { Sound.tone(523, 0.10, 'sine', 0.14); setTimeout(function(){Sound.tone(784,0.16,'sine',0.13);}, 90); },
    great: function () { [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){Sound.tone(f,0.16,'sine',0.13);}, i*80); }); },
    bad:   function () { Sound.tone(180, 0.30, 'sawtooth', 0.13, 60); },
    ping:  function () { Sound.tone(1200, 0.5, 'sine', 0.09, 400); }
  };

  /* ---------------- haptics ---------------- */
  function buzz(ms) { if (!muted && navigator.vibrate) { try { navigator.vibrate(ms || 12); } catch (e) {} } }

  /* ---------------- canvas + loop ---------------- */
  function Engine(canvasId) {
    var cv = document.getElementById(canvasId);
    var ctx = cv.getContext('2d');
    var self = {
      canvas: cv, ctx: ctx,
      w: 0, h: 0, dpr: 1,
      running: false, t: 0,
      onResize: null, onUpdate: null, onRender: null
    };

    function resize() {
      var r = cv.getBoundingClientRect();
      var dpr = Math.min(global.devicePixelRatio || 1, 2.5);
      self.w = Math.max(1, Math.round(r.width));
      self.h = Math.max(1, Math.round(r.height));

      cv.width = Math.round(self.w * dpr);
      cv.height = Math.round(self.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    }

    var last = 0;

      last = ts; self.t += dt;

    self.start = function () { if (self.running) return; self.running = true; last = 0; requestAnimationFrame(frame); };

  /* handlers: {down(x,y,e), move(x,y,e), up(x,y,e)} in CSS pixels
     relative to the element. Mouse and touch both funnel through
     pointer events; multi-touch beyond the first finger is ignored. */
  function Input(el, handlers) {
    var id = null;
    function pos(e) {
      var r = el.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    el.addEventListener('pointerdown', function (e) {
      if (id !== null) return;
      id = e.pointerId;
      try { el.setPointerCapture(id); } catch (err) {}
      var p = pos(e); if (handlers.down) handlers.down(p.x, p.y, e);
      e.preventDefault();

    el.addEventListener('pointermove', function (e) {
      if (e.pointerId !== id) return;
      var p = pos(e); if (handlers.move) handlers.move(p.x, p.y, e);
      e.preventDefault();

    function end(e) {
      if (e.pointerId !== id) return;
      var p = pos(e); id = null;
      if (handlers.up) handlers.up(p.x, p.y, e);
      e.preventDefault();

    el.addEventListener('pointercancel', end, { passive: false });

  var U = {
    clamp: function (v, a, b) { return v < a ? a : v > b ? b : v; },
    lerp:  function (a, b, t) { return a + (b - a) * t; },
    dist:  function (ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); },
    rand:  function (a, b) { return a + Math.random() * (b - a); },
    ri:    function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
    pick:  function (arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    /* deterministic PRNG — used for daily puzzles and seeded levels */
    seeded: function (seed) {

        s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
        return s / 4294967296;
      };

    /* round-rect path that works on every WebView we care about */
    rr: function (ctx, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);

  /* ---------------- screens + toast ---------------- */
  var UI = {
    show: function (id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
      if (id) { var el = document.getElementById(id); if (el) el.classList.add('on'); }
    },
    hide: function () { document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); }); },
    toast: function (msg, ms) {

  /* keep the loop honest when the app is backgrounded */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && global.Game && global.Game.onBackground) global.Game.onBackground();
  });

  global.Store = Store;
  global.Sound = Sound;
  global.Buzz = buzz;
  global.Engine = Engine;
  global.Input = Input;
  global.U = U;
  global.UI = UI;

<script>/* ============================================================
   Store + launcher artwork, drawn on canvas. No image files in,
   PNGs out. Run via tools/render-assets.mjs.
   ============================================================ */
(function (g) {
'use strict';

var GAMES = {
  echo:      { name:'ECHO',       sub:'See with sound',              bg:['#04121a','#0a2a33'], key:'#4ee1c1' },
  starfall:  { name:'STARFALL',   sub:'Slingshot the galaxy',        bg:['#0a0a22','#1d1440'], key:'#ffc857' },
  prism:     { name:'PRISM',      sub:'Split the light',             bg:['#0b0716','#221342'], key:'#7c5cff' },
  vortex:    { name:'VORTEX',     sub:"Don't touch the walls",       bg:['#03121c','#062b3d'], key:'#43d9ff' },
  dailylock: { name:'DAILY LOCK', sub:'One lock a day',              bg:['#0d1020','#1b2340'], key:'#4ee1c1' },
  /* the collection itself — the app's own identity */
  playbox:   { name:'PLAYBOX',    sub:'Mind & reflex games',        bg:['#080b14','#141b33'], key:'#4ee1c1' }
};

/* the five games' accents, in shelf order — the collection mark is built from them */
var WEDGE = ['#4ee1c1', '#ffc857', '#7c5cff', '#43d9ff', '#ff6b9d'];
var SLUGS = ['echo', 'starfall', 'prism', 'vortex', 'dailylock'];

function bgFill(ctx, slug, w, h) {
  var c = GAMES[slug].bg;
  var grd = ctx.createLinearGradient(0, 0, w * 0.4, h);
  grd.addColorStop(0, c[0]); grd.addColorStop(1, c[1]);
  ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
}

/* ---------------- per-game emblem, drawn in a unit box ----------------
   All emblems draw inside (-0.5..0.5, -0.5..0.5) so they scale anywhere. */
var EMBLEM = {

  echo: function (ctx) {
    // expanding sonar rings + fragments of lit maze wall
    ctx.lineCap = 'round';
    for (var i = 3; i >= 1; i--) {
      var r = i * 0.135;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(78,225,193,' + (0.95 - i * 0.24) + ')';
      ctx.lineWidth = 0.028 - i * 0.004;
      ctx.stroke();
    }
    // lit wall fragments the ring has just touched
    var segs = [[-0.44,-0.30,-0.10,-0.30],[-0.10,-0.30,-0.10,0.02],
                [ 0.16,-0.42, 0.16,-0.06],[ 0.16,-0.06, 0.44,-0.06],
                [-0.44, 0.20, -0.06,0.20],[ 0.06, 0.16, 0.06, 0.46],
                [ 0.06, 0.46,  0.42,0.46]];
    ctx.lineWidth = 0.036; ctx.lineCap = 'round';
    for (var s = 0; s < segs.length; s++) {
      var a = segs[s];
      var d = Math.hypot((a[0]+a[2])/2, (a[1]+a[3])/2);
      ctx.strokeStyle = 'rgba(190,255,242,' + Math.max(0.16, 0.85 - d * 1.25) + ')';
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(a[2], a[3]); ctx.stroke();
    }
    // player blip
    var gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 0.14);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.28, 'rgba(180,255,240,.8)');
    gr.addColorStop(1, 'rgba(78,225,193,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 0.032, 0, Math.PI * 2); ctx.fill();
  },

  starfall: function (ctx) {
    // planet with a comet whipping around it
    var pg = ctx.createRadialGradient(-0.10, 0.14, 0.02, -0.06, 0.18, 0.30);
    pg.addColorStop(0, '#8b7bff'); pg.addColorStop(1, '#2b1f6b');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(-0.08, 0.16, 0.24, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(140,120,255,.55)'; ctx.lineWidth = 0.014;
    ctx.beginPath(); ctx.arc(-0.08, 0.16, 0.30, 0, Math.PI * 2); ctx.stroke();

    // slingshot trajectory
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-0.46, 0.46);
    ctx.bezierCurveTo(-0.34, 0.02, 0.10, -0.02, 0.20, -0.24);
    var tg = ctx.createLinearGradient(-0.46, 0.46, 0.24, -0.44);
    tg.addColorStop(0, 'rgba(255,200,87,0)'); tg.addColorStop(0.55, 'rgba(255,200,87,.75)');
    tg.addColorStop(1, '#fff3d0');
    ctx.strokeStyle = tg; ctx.lineWidth = 0.042; ctx.stroke();

    // comet head
    var cg = ctx.createRadialGradient(0.235, -0.30, 0, 0.235, -0.30, 0.13);
    cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.3, '#ffd873');
    cg.addColorStop(1, 'rgba(255,200,87,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0.235, -0.30, 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0.235, -0.30, 0.038, 0, Math.PI * 2); ctx.fill();

    // sparse stars
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    var st = [[-0.38,-0.30,0.012],[0.40,0.30,0.014],[-0.24,-0.44,0.009],[0.44,-0.06,0.010],[0.06,0.44,0.011]];
    for (var i = 0; i < st.length; i++) { ctx.beginPath(); ctx.arc(st[i][0], st[i][1], st[i][2], 0, Math.PI*2); ctx.fill(); }
  },

  prism: function (ctx) {
    // white beam into a triangle, RGB fan out
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.055;
    ctx.beginPath(); ctx.moveTo(-0.50, -0.02); ctx.lineTo(-0.115, -0.02); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 0.13;
    ctx.beginPath(); ctx.moveTo(-0.50, -0.02); ctx.lineTo(-0.115, -0.02); ctx.stroke();

    // fan
    var cols = ['#ff5470', '#4eff9b', '#5aa8ff'];
    var ang  = [-0.30, 0, 0.30];
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 3; i++) {
      var x2 = 0.52, y2 = -0.02 + Math.tan(ang[i]) * (x2 - 0.11);
      ctx.strokeStyle = cols[i]; ctx.lineWidth = 0.046;
      ctx.beginPath(); ctx.moveTo(0.10, -0.02); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.globalAlpha = 0.30; ctx.lineWidth = 0.115;
      ctx.beginPath(); ctx.moveTo(0.10, -0.02); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // the prism itself
    ctx.beginPath();
    ctx.moveTo(0, -0.40); ctx.lineTo(0.27, 0.24); ctx.lineTo(-0.27, 0.24); ctx.closePath();
    var pg = ctx.createLinearGradient(-0.27, -0.40, 0.27, 0.24);
    pg.addColorStop(0, 'rgba(255,255,255,.20)'); pg.addColorStop(1, 'rgba(124,92,255,.34)');
    ctx.fillStyle = pg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 0.024; ctx.lineJoin = 'round'; ctx.stroke();
  },

  vortex: function (ctx) {
    // core + collapsing arcs with gaps + ship
    var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 0.22);
    cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.18, '#bfe9ff');
    cg.addColorStop(1, 'rgba(67,217,255,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 0.052, 0, Math.PI * 2); ctx.fill();

    ctx.lineCap = 'round';
    var rings = [
      { r: 0.235, a0: 0.62, a1: 5.70, w: 0.055, c: 'rgba(67,217,255,.95)' },
      { r: 0.345, a0: 2.55, a1: 1.35, w: 0.052, c: 'rgba(67,217,255,.62)' },
      { r: 0.452, a0: 4.20, a1: 3.05, w: 0.048, c: 'rgba(67,217,255,.32)' }
    ];
    for (var i = 0; i < rings.length; i++) {
      var R = rings[i];
      ctx.beginPath(); ctx.arc(0, 0, R.r, R.a0, R.a1);
      ctx.strokeStyle = R.c; ctx.lineWidth = R.w; ctx.stroke();
    }
    // ship sitting in the first gap
    ctx.save(); ctx.translate(0, -0.235); ctx.rotate(0);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(0, -0.055); ctx.lineTo(0.045, 0.042); ctx.lineTo(0, 0.016); ctx.lineTo(-0.045, 0.042); ctx.closePath();
    ctx.fill();
    ctx.restore();
  },

  /* PLAYBOX: five wedges around a bright core. One mark that says
     "more than one game" at 48px, and the wedge colours are the games'
     own accents so the icon and the shelf agree. */
  playbox: function (ctx) {
    /* Light thrown out of a core in five directions. Bright at the rim so it
       reads as emission rather than as a pie chart, with real gaps between
       the blades and rounded ends. */
    var R = 0.48, r0 = 0.135, gap = 0.30, rot = -Math.PI / 2 - 0.22;
    var step = Math.PI * 2 / 5;
    for (var i = 0; i < 5; i++) {
      var a0 = rot + i * step + gap / 2;
      var a1 = rot + (i + 1) * step - gap / 2;
      var mid = (a0 + a1) / 2;
      var g = ctx.createLinearGradient(Math.cos(mid) * r0, Math.sin(mid) * r0,
                                       Math.cos(mid) * R,  Math.sin(mid) * R);
      g.addColorStop(0, shade(WEDGE[i], -0.30));
      g.addColorStop(0.55, WEDGE[i]);
      g.addColorStop(1, shade(WEDGE[i], 0.34));

      // blade: an arc at R, tapering to a point near the core
      var w0 = 0.020, w1 = 0.104;                 // half-widths, inner and outer
      ctx.beginPath();
      ctx.moveTo(Math.cos(mid) * (r0 * 0.55), Math.sin(mid) * (r0 * 0.55));
      ctx.lineTo(Math.cos(a0) * R * 0.99, Math.sin(a0) * R * 0.99);
      ctx.arc(0, 0, R, a0, a1);
      ctx.lineTo(Math.cos(mid) * (r0 * 0.55), Math.sin(mid) * (r0 * 0.55));
      ctx.closePath();
      ctx.fillStyle = g;
      ctx.fill();
      void w0; void w1;
    }
    // core
    var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, r0 * 1.5);
    cg.addColorStop(0, '#ffffff');
    cg.addColorStop(0.42, 'rgba(220,240,255,.55)');
    cg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, r0 * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, r0 * 0.40, 0, Math.PI * 2); ctx.fill();
  },

  dailylock: function (ctx) {
    // padlock with three glyph dials
    ctx.strokeStyle = 'rgba(190,206,240,.9)'; ctx.lineWidth = 0.072; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -0.13, 0.205, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.205, -0.13); ctx.lineTo(-0.205, -0.02);
    ctx.moveTo(0.205, -0.13); ctx.lineTo(0.205, -0.02); ctx.stroke();

    var bg2 = ctx.createLinearGradient(0, -0.04, 0, 0.44);
    bg2.addColorStop(0, '#3b4a72'); bg2.addColorStop(1, '#1b2340');
    ctx.fillStyle = bg2;
    rr(ctx, -0.375, -0.04, 0.75, 0.50, 0.085); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 0.014; ctx.stroke();

    // three dials: triangle, square(accent), star
    var dx = [-0.20, 0, 0.20], R = 0.115;
    for (var i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(dx[i], 0.21, R, 0, Math.PI * 2);
      ctx.fillStyle = '#0d1020'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.24)'; ctx.lineWidth = 0.012; ctx.stroke();
    }
    // glyph 1 triangle
    ctx.fillStyle = '#ffc857';
    ctx.beginPath(); ctx.moveTo(-0.20, 0.145); ctx.lineTo(-0.145, 0.255); ctx.lineTo(-0.255, 0.255); ctx.closePath(); ctx.fill();
    // glyph 2 square
    ctx.fillStyle = '#7c5cff'; rr(ctx, -0.052, 0.158, 0.104, 0.104, 0.02); ctx.fill();
    // glyph 3 star
    star(ctx, 0.20, 0.208, 0.058, 0.026, 5, '#ff5470');
    // solved indicator
    ctx.fillStyle = '#4ee1c1';
    ctx.beginPath(); ctx.arc(0, -0.30, 0.030, 0, Math.PI * 2); ctx.fill();
  }
};

/* darken/lighten a #rrggbb by a fraction */
function shade(hex, amt) {
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  function f(v) { return Math.max(0, Math.min(255, Math.round(v + (amt < 0 ? v * amt : (255 - v) * amt)))); }
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function star(ctx, cx, cy, R, r, n, col) {
  ctx.beginPath();
  for (var i = 0; i < n * 2; i++) {
    var a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R;
    ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}

/* ---------------- public renderers ---------------- */

/* square launcher / store icon */
function drawIcon(ctx, slug, size, opts) {
  opts = opts || {};
  ctx.clearRect(0, 0, size, size);
  if (!opts.transparent) {
    bgFill(ctx, slug, size, size);
    // subtle vignette so the emblem pops on any wallpaper
    var v = ctx.createRadialGradient(size/2, size*0.42, size*0.1, size/2, size/2, size*0.72);
    v.addColorStop(0, 'rgba(255,255,255,.05)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, size, size);
  }
  ctx.save();
  ctx.translate(size / 2, size / 2);
  ctx.scale(size * (opts.scale || 0.80), size * (opts.scale || 0.80));
  ctx.lineJoin = 'round';
  EMBLEM[slug](ctx);
  ctx.restore();
}

/* 1024x500 Play feature graphic */
function drawFeature(ctx, slug, w, h) {
  var G = GAMES[slug];
  bgFill(ctx, slug, w, h);

  // faint radial wash behind the emblem
  var v = ctx.createRadialGradient(w * 0.215, h * 0.5, 10, w * 0.24, h * 0.5, h * 0.95);
  v.addColorStop(0, 'rgba(255,255,255,.09)'); v.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);

  // emblem, left third
  ctx.save();
  ctx.translate(w * 0.215, h * 0.5);
  ctx.scale(h * 0.82, h * 0.82);
  ctx.lineJoin = 'round';
  EMBLEM[slug](ctx);
  ctx.restore();

  // wordmark, right — auto-shrunk so long names never clip
  var x = w * 0.44, maxW = w - x - w * 0.05;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  function fit(text, startPx, weight, tracking) {
    var px = startPx;
    for (var i = 0; i < 40; i++) {
      ctx.font = weight + ' ' + Math.round(px) + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
      ctx.letterSpacing = Math.round(px * tracking) + 'px';
      // letterSpacing is not counted by measureText in every engine — add it back
      var wdt = ctx.measureText(text).width + Math.round(px * tracking) * (text.length - 1);
      if (wdt <= maxW) return px;
      px *= 0.94;
    }
    return px;
  }

  var titlePx = fit(G.name, h * 0.175, '800', 0.10);
  var tg = ctx.createLinearGradient(x, h * 0.30, x, h * 0.52);
  tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, G.key);
  ctx.fillStyle = tg;
  ctx.font = '800 ' + Math.round(titlePx) + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.letterSpacing = Math.round(titlePx * 0.10) + 'px';
  ctx.fillText(G.name, x, h * 0.50);

  var subPx = fit(G.sub.toUpperCase(), h * 0.068, '500', 0.09);
  ctx.font = '500 ' + Math.round(subPx) + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.letterSpacing = Math.round(subPx * 0.09) + 'px';
  ctx.fillStyle = 'rgba(232,237,247,.72)';
  ctx.fillText(G.sub.toUpperCase(), x, h * 0.635);

  // thin accent rule
  ctx.fillStyle = G.key;
  ctx.fillRect(x, h * 0.705, h * 0.24, Math.max(2, h * 0.010));
  ctx.letterSpacing = '0px';
}

/* 1024x500 feature graphic for the collection: the five game emblems in a
   row above the wordmark, so the store page shows what is actually inside. */
function drawCollectionFeature(ctx, w, h) {
  bgFill(ctx, 'playbox', w, h);
  var v = ctx.createRadialGradient(w * 0.5, h * 0.30, 10, w * 0.5, h * 0.5, w * 0.62);
  v.addColorStop(0, 'rgba(255,255,255,.10)'); v.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);

  // wordmark
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  var titlePx = Math.round(h * 0.20);
  ctx.font = '800 ' + titlePx + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.letterSpacing = Math.round(titlePx * 0.13) + 'px';
  var tg = ctx.createLinearGradient(0, h * 0.34, 0, h * 0.58);
  tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, GAMES.playbox.key);
  ctx.fillStyle = tg;
  ctx.fillText('PLAYBOX', w / 2, h * 0.585);

  var subPx = Math.round(h * 0.062);
  ctx.font = '500 ' + subPx + 'px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  ctx.letterSpacing = Math.round(subPx * 0.16) + 'px';
  ctx.fillStyle = 'rgba(232,237,247,.70)';
  ctx.fillText('FIVE GAMES · ONE APP · PLAYS OFFLINE', w / 2, h * 0.705);
  ctx.letterSpacing = '0px';

  // the five emblems, evenly spaced above the wordmark
  var size = h * 0.30, gap = size * 0.34;
  var total = SLUGS.length * size + (SLUGS.length - 1) * gap;

    ctx.translate(x0 + i * (size + gap), h * 0.245);
    ctx.scale(size, size);
    ctx.lineJoin = 'round';
    EMBLEM[SLUGS[i]](ctx);
    ctx.restore();
  }

function drawSplash(ctx, slug, size) {

  ctx.save();
  ctx.translate(size / 2, size / 2);
  ctx.scale(size * 0.30, size * 0.30);

  ctx.restore();

      'Tokens earned from the challenge spend on boosts in any game.'

  var R = {
    games: GAMES,
    changelog: CHANGELOG,
    by: function (slug) {

      return null;
    },
    /* Every goal, flattened, for the daily picker. */
    allGoals: function () {
      var out = [];
      GAMES.forEach(function (g) {
        (g.goals || []).forEach(function (goal) {
          out.push({ game: g.slug, id: goal.id, text: goal.text, need: goal.need, count: goal.count });
        });
      });
      return out;
    },
    goal: function (id) {
      var all = R.allGoals();
      for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
      return null;
    },
    shopRows: function () {
      var out = [];
      GAMES.forEach(function (g) {
        (g.shop || []).forEach(function (row) {
          out.push({ game: g.slug, gameName: g.name, accent: g.accent,
                     key: row.key, label: row.label, note: row.note,
                     cost: row.cost, grant: row.grant });
        });
      });
      return out;
    },
    /* Games added after `version` — drives the NEW badge. */
    newerThan: function (version) {
      return GAMES.filter(function (g) { return cmp(g.slug && g.since, version) > 0; });
    }
  };

  /* semver-ish compare, enough for x.y.z */
  function cmp(a, b) {
    if (!a || !b) return 0;
    /* A placeholder like 'NEXT_VERSION' would silently compare as 0.0.0 and the
       game would never get a NEW badge. Fail loudly in the console instead. */
    if (!/^\d+\.\d+\.\d+$/.test(String(a)) || !/^\d+\.\d+\.\d+$/.test(String(b))) {
      console.warn('[registry] not a version:', a, b);
      return 0;
    }
    var x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
    for (var i = 0; i < 3; i++) {
      var d = (x[i] || 0) - (y[i] || 0);
      if (d) return d < 0 ? -1 : 1;
    }
    return 0;
  }
  R.cmpVersion = cmp;

  global.Registry = R;
})(window);

<script>/* ============================================================
   Cross-game profile: tokens, boosts, the daily challenge and
   the streak. This is the layer that makes one app worth more
   than five — a player who came for one game gets a reason to
   open another, and a reason to come back tomorrow.

   Pure logic, no DOM. Owned by the hub; games reach the parts
   they need through shared/pb-child.js.
   ============================================================ */
(function (global) {
  'use strict';

  var KEY   = 'playbox:profile';
  var EPOCH = Date.UTC(2026, 0, 1);      // day 1 = 2026-01-01 UTC

  var TOKENS_PER_GOAL = 3;
  var TOKENS_ALL_THREE = 5;
  var TOKENS_FIRST_RUN = 10;             // so the shop isn't a locked door
  var GOALS_PER_DAY = 3;

  function blank() {
    return {
      tokens: 0,
      streak: 0, maxStreak: 0,
      lastCompleteDay: 0,                // last day all three goals were done
      maxDaySeen: 0,                     // high-water mark; blocks clock-rollback farming
      daily: null,                       // { day, goals:[{id,game,progress,done}], bonusPaid }
      boosts: {},                        // { echo_pings: 3, ... }
      plays: {},                         // { slug: launch count }
      seenVersion: null,                 // for the what's-new sheet
      firstRunPaid: false
    };
  }

  var S = blank();

  function read() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var got = JSON.parse(raw);
        var base = blank();
        for (var k in base) if (got[k] !== undefined) base[k] = got[k];
        S = base;
      }
    } catch (e) {
      /* A corrupt or unreadable value must not cost the player their profile.
         Keep whatever is in memory; the next save rewrites a valid document. */
    }
    return S;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ---------------- dates ---------------- */
  function dayNumber(d) {
    d = d || new Date();
    return Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - EPOCH) / 86400000) + 1;
  }
  function msUntilNextDay(d) {
    d = d || new Date();
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1) - d.getTime();
  }

  /* deterministic PRNG so everyone gets the same challenge */
  function rngFor(day) {
    var s = (day * 2654435761) >>> 0;
    return function () {
      s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  /* ---------------- the daily challenge ---------------- */
  /* Three goals, each from a different game, chosen from the date alone.
     Deterministic, so it is the same challenge on every device — which is
     what makes it worth talking about. */
  function pickGoals(day) {
    var rand = rngFor(day);
    var pool = (global.Registry ? Registry.allGoals() : []);
    var byGame = {};
    pool.forEach(function (g) { (byGame[g.game] = byGame[g.game] || []).push(g); });

    var slugs = Object.keys(byGame);
    /* Fisher-Yates with the seeded PRNG */
    for (var i = slugs.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var t = slugs[i]; slugs[i] = slugs[j]; slugs[j] = t;
    }
    var out = [];
    for (var k = 0; k < slugs.length && out.length < GOALS_PER_DAY; k++) {
      var list = byGame[slugs[k]];
      var pick = list[Math.floor(rand() * list.length)];
      out.push({ id: pick.id, game: pick.game, progress: 0, done: false });
    }
    return out;
  }

  /* Rolls the challenge over when the UTC date changes, and settles the
     streak. Call this before reading `daily` anywhere. */
  function refresh(now) {
    var day = dayNumber(now);

    /* The device clock is not trustworthy. Winding it back would otherwise
       regenerate a day that was already completed and pay for it again, and
       rewrite lastCompleteDay so the streak could be advanced twice in one
       real day. A high-water mark makes the day monotonic. */
    if (day < (S.maxDaySeen || 0)) day = S.maxDaySeen;
    else if (day > (S.maxDaySeen || 0)) { S.maxDaySeen = day; save(); }

    /* A goal or a game can disappear in an update. A stored slot pointing at
       one is a dead end for the rest of the day, so treat it as a new day. */
    var stale = !!(S.daily && S.daily.goals.some(function (slot) {
      return !global.Registry || !Registry.goal(slot.id) || !Registry.by(slot.game);
    }));

    if (!S.daily || S.daily.day !== day || stale) {
      /* A day with no completion, other than yesterday's grace, ends a run. */
      if (S.streak > 0 && S.lastCompleteDay < day - 1) S.streak = 0;
      S.daily = { day: day, goals: pickGoals(day), bonusPaid: false };
      save();
    }
    if (!S.firstRunPaid) {
      S.firstRunPaid = true;
      S.tokens += TOKENS_FIRST_RUN;
      save();
    }
    return S.daily;
  }

  /* ---------------- events from games ---------------- */
  /* ev: { game:'echo', type:'level', ...whatever the goal reads }
     Returns a summary the hub can turn into a toast. */
  function report(ev) {
    if (!ev || !ev.game) return { tokens: 0, completed: [], allDone: false };

    /* Deliberately NOT refresh() here. A run that started at 23:58 and ends at
       00:01 must be graded against the challenge the player was shown, not
       against tomorrow's — rolling over here threw away the finished day's
       progress and scored the run against goals the player never saw. The hub
       rolls the day over on its own clock, which only ticks with no game open. */
    if (!S.daily) refresh();

    var gained = 0, completed = [];
    S.daily.goals.forEach(function (slot) {
      if (slot.done || slot.game !== ev.game) return;
      var goal = global.Registry ? Registry.goal(slot.id) : null;
      if (!goal || typeof goal.count !== 'function') return;
      var hit = false;
      try { hit = !!goal.count(ev); } catch (e) { hit = false; }
      if (!hit) return;
      slot.progress++;
      if (slot.progress >= goal.need) {
        slot.done = true;
        gained += TOKENS_PER_GOAL;
        completed.push({ id: slot.id, text: goal.text });
      }
    });

    var allDone = S.daily.goals.length > 0 && S.daily.goals.every(function (s) { return s.done; });
    if (allDone && !S.daily.bonusPaid) {
      S.daily.bonusPaid = true;
      gained += TOKENS_ALL_THREE;
      if (S.lastCompleteDay !== S.daily.day) {
        /* Yesterday keeps the run alive; anything older starts a new one. */
        S.streak = (S.lastCompleteDay === S.daily.day - 1) ? S.streak + 1 : 1;
        S.lastCompleteDay = S.daily.day;
        if (S.streak > S.maxStreak) S.maxStreak = S.streak;
      }
    }
    S.tokens += gained;
    save();
    return { tokens: gained, completed: completed, allDone: allDone, streak: S.streak };
  }

  function noteLaunch(slug) {
    refresh();
    S.plays[slug] = (S.plays[slug] || 0) + 1;
    save();
  }

  /* ---------------- tokens and boosts ---------------- */
  function buy(row) {
    if (!row || S.tokens < row.cost) return false;
    S.tokens -= row.cost;
    S.boosts[row.key] = (S.boosts[row.key] || 0) + row.grant;
    save();
    return true;
  }

  /* Games claim boosts through this. Decrements, so a boost is spent once.
     No re-read: games do not load this file — PB.takeBoost runs in the hub's
     own realm against this same S, and JS is single-threaded. Re-reading here
     used to revert every unsaved change (a failed save, or a rollover) back to
     the last snapshot on disk. */
  function takeBoost(key, max) {
    var have = S.boosts[key] || 0;
    if (have <= 0) return 0;
    var take = (max === undefined) ? have : Math.min(have, max);
    S.boosts[key] = have - take;
    save();
    return take;
  }
  function peekBoost(key) { return S.boosts[key] || 0; }

  /* ---------------- stats, read from each game's own storage ---------------- */
  /* The games are unchanged in how they save; the hub just knows where to look.
     Keeping this in one place means a new game adds one case, not a refactor. */
  function gameStat(slug) {
    function g(key, dflt) {
      try {
        var v = localStorage.getItem(slug + ':' + key);
        return v === null ? dflt : JSON.parse(v);
      } catch (e) { return dflt; }
    }
    switch (slug) {
      case 'echo':      return { primary: Math.max(0, g('unlocked', 1) - 1), label: 'levels cleared', of: 60 };
      case 'prism':      var st = g('stars', {}); var sum = 0;
                         for (var k in st) sum += st[k] || 0;
                         return { primary: sum, label: 'stars', of: 135 };
      case 'starfall':   return { primary: g('best', 0), label: 'best light years' };
      case 'vortex':     return { primary: g('best', 0), label: 'best score' };
      case 'dailylock':  var s = g('stats', null);
                         return { primary: (s && s.streak) || 0, label: 'day streak' };
      default:           return { primary: 0, label: 'played' };
    }
  }

  global.Profile = {
    read: read, save: save, refresh: refresh,
    get state() { return S; },
    get tokens() { return S.tokens; },
    dayNumber: dayNumber, msUntilNextDay: msUntilNextDay,
    pickGoals: pickGoals,
    report: report, noteLaunch: noteLaunch,
    buy: buy, takeBoost: takeBoost, peekBoost: peekBoost,
    gameStat: gameStat,
    /* exposed for tests */
    _blank: blank, _reset: function () { S = blank(); save(); },
    TOKENS_PER_GOAL: TOKENS_PER_GOAL, TOKENS_ALL_THREE: TOKENS_ALL_THREE,
    TOKENS_FIRST_RUN: TOKENS_FIRST_RUN, GOALS_PER_DAY: GOALS_PER_DAY
  };
})(window);
</script>
